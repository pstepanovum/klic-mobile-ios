name: Klic
options:
  bundleIdPrefix: com.klic
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  postGenCommand: pod install

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    from: "2.0.0"
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift.git
    from: "16.1.0"
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    from: "4.5.0"
  Inject:
    url: https://github.com/krzysztofzablocki/Inject.git
    from: "1.5.2"
  # Email linking (§12.2): Google sign-in for POST /me/email/google.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: "8.0.0"

settings:
  base:
    # CocoaPods script phases (embed frameworks, libsignal FFI download) need
    # file access that Xcode's user-script sandboxing denies.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.6.21"
    CURRENT_PROJECT_VERSION: "82"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "V7H9Y9K6Z7"
    # iPhone-only (App Store error 90474): the portrait-only UI would otherwise have
    # to support all four iPad orientations for multitasking or declare
    # UIRequiresFullScreen. iPads still run the app in iPhone-compatibility mode,
    # and no iPad screenshots are required for the store listing.
    TARGETED_DEVICE_FAMILY: "1"
    # Localization (§10.5): compile string tables from code literals so the
    # Localizable.xcstrings catalog (en/ru/zh-Hans) resolves Text()/String(localized:).
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Debug:
      # DEBUG is restated because naming this setting here replaces XcodeGen's
      # debug preset value. KLIC_UPDATE_CHECKS compiles in the self-update
      # feature (§14.7) — the GitHub "latest release" checker and its UI.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG KLIC_UPDATE_CHECKS
    Release:
      # App Store builds must NOT ship the self-updater: it points people at
      # AltStore / TestFlight / GitHub releases (App Review 2.4.5, 3.2.2, 3.1.1)
      # and polls api.github.com every six hours. With the flag absent none of
      # that code is compiled, so there is no Updates row, no launch check and
      # no GitHub request at all. A sideload or TestFlight release that wants it
      # back is built with the flag switched on:
      #   xcodebuild ... KLIC_RELEASE_SWIFT_CONDITIONS=KLIC_UPDATE_CHECKS
      KLIC_RELEASE_SWIFT_CONDITIONS: ""
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(KLIC_RELEASE_SWIFT_CONDITIONS)

targets:
  Klic:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Resources also carries the first-party privacy manifest
      # (Resources/PrivacyInfo.xcprivacy). XcodeGen has no build phase for the
      # .xcprivacy extension, so it lands in Copy Bundle Resources and ships at
      # the app bundle root, which is where App Review looks for it. Apple reads
      # it from the built product only — keep it inside a declared source path.
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.klic.mobile.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Resources/Info.plist
        # LibSignalClient's public interface references its C FFI module; the app
        # target must be able to resolve it too (the podspec only sets this on
        # the pod target).
        SWIFT_INCLUDE_PATHS: "$(inherited) $(PODS_ROOT)/LibSignalClient/swift/Sources/SignalFfi"
        CODE_SIGN_ENTITLEMENTS: Resources/Klic.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # NO: CocoaPods script phases (embed frameworks, libsignal FFI download)
        # need file access that Xcode's user-script sandboxing denies.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: LiveKit
      - package: SocketIO
      - package: Lottie
      - package: Inject
      - package: GoogleSignIn
      - target: KlicWidgets
      - target: KlicShare
      - target: KlicBroadcast

  KlicWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Sources/Shared          # CallActivityAttributes shared with the app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.klic.mobile.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Widget/Info.plist

  # Share-sheet target ("Share to" panel). Compiles only the minimal shared sources it
  # needs (TokenStore/AppConfig/KlicColor/KlicFont) — NOT the full APIClient, which would
  # drag in the E2EE/libsignal stack; networking lives in ShareExtension/ShareAPI.swift.
  KlicShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Sources/Networking/TokenStore.swift
      - path: Sources/App/AppConfig.swift
      - path: Sources/DesignSystem/KlicColor.swift
      - path: Sources/DesignSystem/KlicFont.swift
      # Only the face the panel actually uses — registered via UIAppFonts in the
      # extension's Info.plist.
      - path: Resources/Fonts/TikTokSans-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.klic.mobile.app.share
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: ShareExtension/Info.plist
        # App group = shared keychain access group; how the extension reads the tokens.
        CODE_SIGN_ENTITLEMENTS: ShareExtension/KlicShare.entitlements

  # ReplayKit broadcast upload extension. Publishes the phone screen into the live LiveKit
  # call: SampleHandler subclasses the SDK's LKSampleHandler, which forwards captured sample
  # buffers to the app over the shared App Group socket. Bundle id MUST be exactly
  # <app-bundle-id>.broadcast so the SDK's default socket-path derivation finds it (no
  # RTCAppGroupIdentifier / RTCScreenSharingExtension Info.plist overrides required).
  KlicBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
    dependencies:
      - package: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.klic.mobile.app.broadcast
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BroadcastExtension/BroadcastExtension.entitlements

# Explicit shared scheme so `xcodegen generate` always emits it. Without this, a malformed-project
# warning (the Sources/Shared vs on-disk Sources/shared case collision) intermittently left the
# regenerated project with NO scheme, so `xcodebuild -scheme Klic` (release.sh archive) failed with
# "does not contain a scheme named Klic". Defining it here makes scheme generation deterministic.
schemes:
  Klic:
    build:
      targets:
        Klic: all
    run:
      config: Debug
    archive:
      config: Release
